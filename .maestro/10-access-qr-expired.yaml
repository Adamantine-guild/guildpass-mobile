appId: xyz.guildpass.mobile
---
# E2E Test: Expired QR Payload
# Validates: Scanner rejects an expired GuildPass access QR with the specific expired error.

- launchApp:
    clearState: true
    permissions:
      camera: allow

# Open access check directly so the scanner route is reachable without API data.
- openLink:
    link: "guildpass://access-check?guildId=alpha-guild&resourceId=vip-door"
- extendedWaitUntil:
    visible:
      id: "access-check-screen"
    timeout: 10000

# Navigate to scanner and simulate the expired QR fixture.
- tapOn:
    id: "scan-qr-button"
- assertVisible:
    text: "Point your camera at a GuildPass access QR code."
- tapOn:
    id: "test-expired-qr-scan"

# Assert the specific error state, not the generic fallback.
- assertVisible:
    text: "QR code rejected"
- assertVisible:
    text: "This QR code has expired."
- assertNotVisible:
    text: "Unable to read QR payload."
