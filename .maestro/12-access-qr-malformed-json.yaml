appId: xyz.guildpass.mobile
---
# E2E Test: Malformed QR JSON
# Validates: Scanner rejects non-JSON QR contents with the specific malformed-payload message.

- launchApp:
    clearState: true
    permissions:
      camera: allow

# Open access check directly so the scanner route is reachable without API data.
- openLink:
    link: "guildpass://access-check?guildId=alpha-guild&resourceId=vip-door"
- extendedWaitUntil:
    visible:
      id: "access-check-screen"
    timeout: 10000

# Navigate to scanner and simulate malformed QR contents.
- tapOn:
    id: "scan-qr-button"
- assertVisible:
    text: "Point your camera at a GuildPass access QR code."
- tapOn:
    id: "test-malformed-qr-json-scan"

# Assert the specific error state, not the generic fallback.
- assertVisible:
    text: "QR code rejected"
- assertVisible:
    text: "QR code is not a supported GuildPass access payload."
- assertNotVisible:
    text: "Unable to read QR payload."
